# =============================================================================
# TURANT — Spring Boot Application Configuration
# All environment variables preserved from TypeScript version
# =============================================================================

# Application
spring.application.name=${APP_NAME:turant}
server.port=${PORT:8080}

# Large CAP payloads (C-DOT Postman 3 MB) + long PostGIS per-geometry scans
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-post-size=20971520
server.tomcat.connection-timeout=120000
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.mvc.async.request-timeout=300000
spring.mvc.async.dispatch-options-request=true
server.tomcat.threads.max=200
server.tomcat.accept-count=100

# Simulation Mode - when enabled, uses simulated tower/subscriber/SMPP instead of real PostgreSQL/SMPP
# REAL MODE = disabled. Must be explicitly set to enabled for simulation/dev mode.
simulation.mode=${SIMULATION_MODE:disabled}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.turant=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database - PostgreSQL + PostGIS
# NOTE: When spring.datasource.url is empty, DataSource auto-configuration is excluded
spring.datasource.url=${DATABASE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${PG_POOL_MAX:30}
spring.datasource.hikari.connection-timeout=${PG_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${PG_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.leak-detection-threshold=60000

# Disable SQL initialization when no DataSource is configured
spring.sql.init.mode=never

# Disable DataSource auto-configuration when URL is not configured
# DataSource is manually created in DatabaseConfig via @ConditionalOnDatabaseConfigured
# Redis auto-config is also excluded; Redis beans created manually in RedisConfig
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Redis
# Spring Data Redis repository auto-config breaks startup when REDIS_URL is
# empty (RedisKeyValueAdapter asserts a non-null RedisOperations bean). The app
# defines its own Redis beans in RedisConfig, which degrade gracefully when the
# store is not configured — so the auto-config/key-value infra stays off here.
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.repositories.enabled=false
turant.redis.key-prefix=${REDIS_KEY_PREFIX:turant:}

# Tower Source Configuration
# Authoritative tower table = sim_cell_towers (created by migration 008, FK target for subscriber_dump.serving_cell_id)
tower.source-mode=${TOWER_SOURCE_MODE:postgis}
tower.table=${TOWER_TABLE:sim_cell_towers}
tower.column.id=${TOWER_COL_ID:site_id}
tower.column.cell-id=${TOWER_COL_CELL_ID:cell_id}
tower.column.latitude=${TOWER_COL_LAT:latitude}
tower.column.longitude=${TOWER_COL_LNG:longitude}
tower.coverage-model=${TOWER_COVERAGE_MODEL:radius}
tower.column.coverage-radius-m=${TOWER_COL_COVERAGE_RADIUS_M:coverage_radius_m}
tower.column.coverage-geom=${TOWER_COL_COVERAGE_GEOM:coverage_geom}
tower.geom-srid=${TOWER_GEOM_SRID:4326}
tower.match-time-budget-ms=${TOWER_MATCH_TIME_BUDGET_MS:300000}
tower.match-limit=${TOWER_MATCH_LIMIT:100000}

# CAP Configuration
cap.preferred-language=${CAP_PREFERRED_LANGUAGE:en-IN}
cap.max-xml-bytes=20971520

# Subscriber Configuration
subscriber.table=${SUBSCRIBER_TABLE:subscribers}
subscriber.column.imsi=${SUBSCRIBER_COL_IMSI:imsi}
subscriber.column.msisdn=${SUBSCRIBER_COL_MSISDN:msisdn}
subscriber.column.cell-id=${SUBSCRIBER_COL_CELL_ID:serving_cell_id}
subscriber.column.tower-id=${SUBSCRIBER_COL_TOWER_ID:tower_id}
subscriber.column.technology=${SUBSCRIBER_COL_TECHNOLOGY:technology}
subscriber.column.status=${SUBSCRIBER_COL_STATUS:status}
subscriber.column.last-seen=${SUBSCRIBER_COL_LAST_SEEN:last_seen}
subscriber.lookup-chunk-size=${SUBSCRIBER_LOOKUP_CHUNK_SIZE:1000}
subscriber.prefetch-enabled=${SUBSCRIBER_PREFETCH_ENABLED:false}

# SMPP Configuration
smpp.host=${SMPP_HOST:}
smpp.port=${SMPP_PORT:2775}
smpp.system-id=${SMPP_SYSTEM_ID:}
smpp.password=${SMPP_PASSWORD:}
smpp.system-type=${SMPP_SYSTEM_TYPE:}
smpp.bind-mode=${SMPP_BIND_MODE:transceiver}
smpp.interface-version=${SMPP_INTERFACE_VERSION:52}
smpp.src-addr-ton=${SMPP_SRC_ADDR_TON:0}
smpp.src-addr-npi=${SMPP_SRC_ADDR_NPI:0}
smpp.src-addr=${SMPP_SRC_ADDR:}
smpp.dest-addr-ton=${SMPP_DEST_ADDR_TON:1}
smpp.dest-addr-npi=${SMPP_DEST_ADDR_NPI:1}
smpp.submit-timeout-ms=${SMPP_SUBMIT_TIMEOUT_MS:60000}
smpp.submit-concurrency=${SMPP_SUBMIT_CONCURRENCY:10}
smpp.reconnect-delay-ms=${SMPP_RECONNECT_DELAY_MS:5000}
smpp.enquire-link-period-ms=${SMPP_ENQUIRE_LINK_PERIOD_MS:30000}
sms.data-coding=${SMS_DATA_CODING:7bit}
sms.registered-delivery=${SMS_REGISTERED_DELIVERY:3}
turant.subscriber.table=${SUBSCRIBER_TABLE:subscribers}
turant.subscriber.col-msisdn=${SUBSCRIBER_COL_MSISDN:msisdn}
turant.subscriber.col-tower-id=${SUBSCRIBER_COL_TOWER_ID:tower_id}
turant.subscriber.col-imsi=${SUBSCRIBER_COL_IMSI:imsi}
turant.subscriber.col-cell-id=${SUBSCRIBER_COL_CELL_ID:cell_id}
turant.subscriber.col-technology=${SUBSCRIBER_COL_TECHNOLOGY:technology}
turant.subscriber.col-status=${SUBSCRIBER_COL_STATUS:status}
turant.subscriber.col-last-seen=${SUBSCRIBER_COL_LAST_SEEN:last_seen}
turant.subscriber.lookup-mode=${SUBSCRIBER_LOOKUP_MODE:prefetched}
turant.subscriber.match-time-budget-ms=${MATCH_TIME_BUDGET_MS:60000}

# Optimized per-cell subscriber counts (migration 010) — polygon alerts SUM
# these precomputed counts instead of scanning the 100M+ row subscriber_dump.
turant.subscriber.stats-table=${CELL_SUBSCRIBER_STATS_TABLE:cell_subscriber_stats}
turant.subscriber.stats-cell-col=${CELL_SUBSCRIBER_STATS_CELL_COL:cell_id}
turant.subscriber.stats-count-col=${CELL_SUBSCRIBER_STATS_COUNT_COL:subscriber_count}
turant.subscriber.stats-unique-col=${CELL_SUBSCRIBER_STATS_UNIQUE_COL:unique_subscriber_count}

# Authoritative raw subscriber source (subscriber_dump, ~190M rows).
# This is the COMPLETE real dataset. The CAP pipeline counts subscribers here
# via serving_cell_id (FK -> sim_cell_towers.cell_id). cell_subscriber_stats is
# only a derived, possibly-partial aggregate used as a fallback.
turant.subscriber.dump-table=${SUBSCRIBER_DUMP_TABLE:subscriber_dump}
turant.subscriber.dump-cell-col=${SUBSCRIBER_DUMP_CELL_COL:serving_cell_id}
turant.subscriber.dump-msisdn-col=${SUBSCRIBER_DUMP_MSISDN_COL:msisdn}

# Telecom Simulation
turant.telecom.use-dummy-db=${USE_DUMMY_SUBSCRIBER_DB:false}
turant.telecom.db-mode=${SUBSCRIBER_DB_MODE:memory}
turant.telecom.sim-region=${SIM_REGION:delhi-ncr}
turant.telecom.sim-seed=${SIM_SEED:20260902}
turant.telecom.dummy-subscriber-count=${DUMMY_SUBSCRIBER_COUNT:1000}
turant.telecom.dummy-tower-count=${DUMMY_TOWER_COUNT:100}
turant.telecom.min-users-per-tower=${MIN_USERS_PER_TOWER:10}
turant.telecom.max-users-per-tower=${MAX_USERS_PER_TOWER:500}
turant.telecom.active-subscriber-pct=${ACTIVE_SUBSCRIBER_PCT:85}
turant.telecom.seed-batch-size=${SEED_BATCH_SIZE:1000}
turant.telecom.seed-workers=${SEED_WORKERS:1}
turant.telecom.seed-use-copy=${SEED_USE_COPY:false}
turant.telecom.seed-reset=${SIM_SEED_RESET:false}
turant.telecom.subscriber-partitions=${SUBSCRIBER_PARTITIONS:0}
turant.telecom.subscriber-lookup-chunk-size=${SUBSCRIBER_LOOKUP_CHUNK_SIZE:1000}

# SMPP Configuration
turant.smpp.host=${SMPP_HOST:}
turant.smpp.port=${SMPP_PORT:2775}
turant.smpp.system-id=${SMPP_SYSTEM_ID:}
turant.smpp.password=${SMPP_PASSWORD:}
turant.smpp.system-type=${SMPP_SYSTEM_TYPE:}
turant.smpp.bind-mode=${SMPP_BIND_MODE:transceiver}
turant.smpp.interface-version=${SMPP_INTERFACE_VERSION:0x34}
turant.smpp.src-addr-ton=${SMPP_SRC_ADDR_TON:0}
turant.smpp.src-addr-npi=${SMPP_SRC_ADDR_NPI:0}
turant.smpp.src-addr=${SMPP_SRC_ADDR:}
turant.smpp.dest-addr-ton=${SMPP_DEST_ADDR_TON:1}
turant.smpp.dest-addr-npi=${SMPP_DEST_ADDR_NPI:1}
turant.smpp.data-coding=${SMS_DATA_CODING:7bit}
turant.smpp.registered-delivery=${SMS_REGISTERED_DELIVERY:0x03}
turant.smpp.reconnect-delay-ms=${SMPP_RECONNECT_DELAY_MS:5000}
turant.smpp.submit-timeout-ms=${SMPP_SUBMIT_TIMEOUT_MS:10000}
turant.smpp.enquire-link-period-ms=${SMPP_ENQUIRE_LINK_PERIOD_MS:30000}
turant.smpp.submit-concurrency=${SMPP_SUBMIT_CONCURRENCY:25}

# Delivery Strategy
turant.delivery.strategy=${DELIVERY_STRATEGY:single-attempt}
turant.delivery.retry-max=${DELIVERY_RETRY_MAX:3}
turant.delivery.retry-interval-ms=${DELIVERY_RETRY_INTERVAL_MS:2000}

# Expiry Control
turant.expiry.halt-submission=${EXPIRY_HALT_SUBMISSION:true}

# EWS Integration — Activity 7 (LOCAL / REMOTE modes)
# LOCAL: no external EWS dependency (dev/test). REMOTE: actual C-DOT EWS/VB.
# Real EWS integration is considered complete only after successful end-to-end
# communication with the authorized C-DOT EWS environment.
# Pending C-DOT EWS integration contract: baseUrl/path/method/auth are configurable.
turant.ews.mode=${EWS_MODE:local}
turant.ews.base-url=${EWS_BASE_URL:}
turant.ews.local-url=${EWS_LOCAL_URL:}
turant.ews.api-key=${EWS_API_KEY:}
turant.ews.username=${EWS_USERNAME:}
turant.ews.password=${EWS_PASSWORD:}
turant.ews.path=${EWS_PATH:/ews/callback}
turant.ews.method=${EWS_METHOD:POST}
turant.ews.connect-timeout=${EWS_CONNECT_TIMEOUT:5s}
turant.ews.read-timeout=${EWS_READ_TIMEOUT:15s}
turant.ews.ssl-enabled=${EWS_SSL_ENABLED:false}
turant.ews.keystore=${EWS_KEYSTORE:}
turant.ews.keystore-password=${EWS_KEYSTORE_PASSWORD:}
turant.ews.truststore=${EWS_TRUSTSTORE:}
turant.ews.truststore-password=${EWS_TRUSTSTORE_PASSWORD:}
# Legacy callback aliases (kept for backward compat with existing pipeline)
turant.ews.callback-url=${EWS_CALLBACK_URL:}
turant.ews.callback-token=${EWS_CALLBACK_TOKEN:}
turant.ews.callback-timeout-ms=${EWS_CALLBACK_TIMEOUT_MS:5000}

# Parallel Processing (Activity 14)
turant.parallel.execution-mode=${PARALLEL_EXECUTION_MODE:threads}
turant.parallel.worker-count=${PARALLEL_WORKER_COUNT:16}
turant.parallel.submit-batch-size=${SUBMIT_BATCH_SIZE:5000}
# Activity 12-13 Infrastructure & TPS augmentation
turant.infra.app-servers=${APP_SERVERS:4}
turant.infra.db-pool-max=${PG_POOL_MAX:30}
turant.smsc.tps-per-tsp=${SMSC_TPS:1000}
# Activity 2 Prefetch
turant.prefetch.storage-dir=${PREFETCH_DIR:./data/prefetch}
turant.prefetch.refresh-ms=${PREFETCH_REFRESH_MS:43200000}
# Activity 3 VLR probe
turant.vlr.parallelism=${VLR_PARALLELISM:16}
turant.vlr.chunk-mb=${VLR_CHUNK_MB:64}
# Activity 6 Batch file SMSC
turant.smsc.batch-dir=${SMSC_BATCH_DIR:./data/smsc}
turant.smsc.file-batch-size=${SMSC_FILE_BATCH:10000}
# Activity 8 Validity & 9 Priority defaults enforced per-message
# Activity 10 Retry already above

# Tracing
turant.trace.ttl-hours=${TRACE_TTL_HOURS:24}

# Debug
turant.debug.endpoints-enabled=${ENABLE_DEBUG_ENDPOINTS:false}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# OpenAPI / Swagger (Activity 1)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# TLS — Item #2 Layer 1 (env-driven, dev disabled via SSL_ENABLED=false, prod SSL_ENABLED=true with keystore)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:turant}
server.ssl.protocol=${SSL_PROTOCOL:TLS}
server.ssl.enabled-protocols=${SSL_ENABLED_PROTOCOLS:TLSv1.2,TLSv1.3}
# mTLS — Item #2 Layer 2
server.ssl.client-auth=${SSL_CLIENT_AUTH:none}
server.ssl.trust-store=${SSL_TRUSTSTORE:}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD:}
server.ssl.trust-store-type=${SSL_TRUSTSTORE_TYPE:PKCS12}

# Security — Item #2 (API key for EWS fallback, mTLS primary in prod)
turant.security.api-key=${EWS_API_KEY:}
turant.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
turant.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
