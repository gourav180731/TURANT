$kind: http-request
name: 'GET alert towers'
method: GET
url: '{{baseUrl}}/api/v1/alerts/:capIdentifier/towers'
order: 5000
pathVariables:
  - key: capIdentifier
    value: '{{capIdentifier}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      const json = pm.response.json();

      if (pm.response.code === 200) {
        pm.test('Towers response contains count and array', function () {
          pm.expect(json.capIdentifier).to.be.a('string');
          pm.expect(json.count).to.be.a('number');
          pm.expect(json.towers).to.be.an('array');
        });
      } else {
        pm.test('404 contains error message', function () {
          pm.expect(json.error).to.be.a('string').and.not.empty;
        });
      }
