$kind: http-request
name: 'GET pipeline status (CANONICAL)'
method: GET
url: '{{baseUrl}}/api/v1/pipeline/status/:capIdentifier'
order: 4000
headers:
  - key: X-API-KEY
    value: '{{apiKey}}'
pathVariables:
  - key: capIdentifier
    value: '{{capIdentifier}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 or 404', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      const json = pm.response.json();

      if (pm.response.code === 200) {
        pm.test('Pipeline status shape is valid', function () {
          pm.expect(json.capIdentifier).to.be.a('string');
          pm.expect(json.status).to.be.a('string');
          pm.expect(json.stage).to.be.a('string');
          pm.expect(json.towerCount).to.be.a('number');
          pm.expect(json.matchedCount).to.be.a('number');
        });

        if (json.status === 'completed') {
          pm.test('Completed pipeline has expectedRecipients', function () {
            pm.expect(json.expectedRecipients).to.be.a('number');
          });
        }

        if (json.status === 'halted') {
          pm.test('Halted pipeline includes reason', function () {
            pm.expect(json.reason).to.be.a('string').and.not.empty;
          });
        }
      } else {
        pm.test('404 contains error message', function () {
          pm.expect(json.error).to.be.a('string').and.not.empty;
        });
      }
