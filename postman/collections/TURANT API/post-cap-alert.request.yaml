$kind: http-request
name: 'POST CAP alert'
method: POST
url: '{{baseUrl}}/api/v1/alerts/cap'
order: 2000
headers:
  - key: Content-Type
    value: application/xml
body:
  type: xml
  content: |-
    <alert xmlns="urn:oasis:names:tc:emergency:cap:1.2">
      <identifier>demo-cap-001</identifier>
      <sender>demo@example.com</sender>
      <sent>2026-08-10T09:00:00Z</sent>
      <status>Actual</status>
      <msgType>Alert</msgType>
      <scope>Public</scope>
      <info>
        <category>Met</category>
        <event>Heavy Rain</event>
        <urgency>Expected</urgency>
        <severity>Severe</severity>
        <certainty>Likely</certainty>
        <headline>Heavy rain warning</headline>
        <description>Demo CAP alert for API testing.</description>
        <expires>2026-08-10T10:00:00Z</expires>
        <area>
          <areaDesc>Demo area</areaDesc>
          <polygon>28.55,77.15 28.55,77.27 28.63,77.30 28.68,77.27 28.68,77.15 28.63,77.12 28.55,77.15</polygon>
        </area>
      </info>
    </alert>
