# TURANT Production Configuration

# Server
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turant}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# Logging
logging.level.root=INFO
logging.level.com.turant=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Logging to file (optional)
#logging.file.name=/var/log/turant/application.log
#logging.file.max-size=10MB
#logging.file.max-history=30

# SMPP
turant.smpp.host=${TURANT_SMPP_HOST:}
turant.smpp.port=${TURANT_SMPP_PORT:2775}
turant.smpp.system-id=${TURANT_SMPP_SYSTEM_ID:}
turant.smpp.password=${TURANT_SMPP_PASSWORD:}
turant.smpp.system-type=
turant.smpp.bind-timeout-ms=5000
turant.smpp.request-timeout-ms=10000

# Simulation
simulation.mode=${SIMULATION_MODE:disabled}

# Actuator (health checks, metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
