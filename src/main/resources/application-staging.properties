# TURANT Staging Configuration

# Server
server.port=8080

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turant_staging}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turant}

# Connection pool (smaller for staging)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# Logging (more verbose for staging)
logging.level.root=INFO
logging.level.com.turant=DEBUG
logging.level.org.springframework.web=DEBUG

# SMPP
turant.smpp.host=${TURANT_SMPP_HOST:}
turant.smpp.port=${TURANT_SMPP_PORT:2775}
turant.smpp.system-id=${TURANT_SMPP_SYSTEM_ID:}
turant.smpp.password=${TURANT_SMPP_PASSWORD:}

# Simulation (usually enabled in staging)
simulation.mode=${SIMULATION_MODE:enabled}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
