# =============================================================================
# TURANT — Spring Boot Application Configuration
# All environment variables preserved from TypeScript version
# =============================================================================

# Application
spring.application.name=${APP_NAME:turant}
server.port=${PORT:8080}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.turant=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database - PostgreSQL + PostGIS
spring.datasource.url=${DATABASE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${PG_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=${PG_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${PG_POOL_IDLE_TIMEOUT_MS:30000}

# Redis
spring.data.redis.url=${REDIS_URL:}
turant.redis.key-prefix=${REDIS_KEY_PREFIX:turant:}

# Tower Source Configuration
tower.source-mode=${TOWER_SOURCE_MODE:postgis}
tower.table=${TOWER_TABLE:cell_towers}
tower.column.id=${TOWER_COL_ID:id}
tower.column.cell-id=${TOWER_COL_CELL_ID:cell_id}
tower.column.latitude=${TOWER_COL_LAT:latitude}
tower.column.longitude=${TOWER_COL_LNG:longitude}
tower.coverage-model=${TOWER_COVERAGE_MODEL:radius}
tower.column.coverage-radius-m=${TOWER_COL_COVERAGE_RADIUS_M:coverage_radius_m}
tower.column.coverage-geom=${TOWER_COL_COVERAGE_GEOM:coverage_geom}
tower.geom-srid=${TOWER_GEOM_SRID:4326}
tower.match-time-budget-ms=${TOWER_MATCH_TIME_BUDGET_MS:5000}
tower.match-limit=${TOWER_MATCH_LIMIT:100000}

# CAP Configuration
cap.preferred-language=${CAP_PREFERRED_LANGUAGE:en-IN}

# Subscriber Configuration
subscriber.table=${SUBSCRIBER_TABLE:subscribers}
subscriber.column.imsi=${SUBSCRIBER_COL_IMSI:imsi}
subscriber.column.msisdn=${SUBSCRIBER_COL_MSISDN:msisdn}
subscriber.column.cell-id=${SUBSCRIBER_COL_CELL_ID:serving_cell_id}
subscriber.column.tower-id=${SUBSCRIBER_COL_TOWER_ID:tower_id}
subscriber.column.technology=${SUBSCRIBER_COL_TECHNOLOGY:technology}
subscriber.column.status=${SUBSCRIBER_COL_STATUS:status}
subscriber.column.last-seen=${SUBSCRIBER_COL_LAST_SEEN:last_seen}
subscriber.lookup-chunk-size=${SUBSCRIBER_LOOKUP_CHUNK_SIZE:1000}
subscriber.prefetch-enabled=${SUBSCRIBER_PREFETCH_ENABLED:false}

# SMPP Configuration
smpp.host=${SMPP_HOST:}
smpp.port=${SMPP_PORT:2775}
smpp.system-id=${SMPP_SYSTEM_ID:}
smpp.password=${SMPP_PASSWORD:}
smpp.system-type=${SMPP_SYSTEM_TYPE:}
smpp.bind-mode=${SMPP_BIND_MODE:transceiver}
smpp.interface-version=${SMPP_INTERFACE_VERSION:52}
smpp.src-addr-ton=${SMPP_SRC_ADDR_TON:0}
smpp.src-addr-npi=${SMPP_SRC_ADDR_NPI:0}
smpp.src-addr=${SMPP_SRC_ADDR:}
smpp.dest-addr-ton=${SMPP_DEST_ADDR_TON:1}
smpp.dest-addr-npi=${SMPP_DEST_ADDR_NPI:1}
smpp.submit-timeout-ms=${SMPP_SUBMIT_TIMEOUT_MS:60000}
smpp.submit-concurrency=${SMPP_SUBMIT_CONCURRENCY:10}
smpp.reconnect-delay-ms=${SMPP_RECONNECT_DELAY_MS:5000}
smpp.enquire-link-period-ms=${SMPP_ENQUIRE_LINK_PERIOD_MS:30000}
sms.data-coding=${SMS_DATA_CODING:7bit}
sms.registered-delivery=${SMS_REGISTERED_DELIVERY:3}
turant.subscriber.table=${SUBSCRIBER_TABLE:subscribers}
turant.subscriber.col-msisdn=${SUBSCRIBER_COL_MSISDN:msisdn}
turant.subscriber.col-tower-id=${SUBSCRIBER_COL_TOWER_ID:tower_id}
turant.subscriber.col-imsi=${SUBSCRIBER_COL_IMSI:imsi}
turant.subscriber.col-cell-id=${SUBSCRIBER_COL_CELL_ID:cell_id}
turant.subscriber.col-technology=${SUBSCRIBER_COL_TECHNOLOGY:technology}
turant.subscriber.col-status=${SUBSCRIBER_COL_STATUS:status}
turant.subscriber.col-last-seen=${SUBSCRIBER_COL_LAST_SEEN:last_seen}
turant.subscriber.lookup-mode=${SUBSCRIBER_LOOKUP_MODE:prefetched}
turant.subscriber.match-time-budget-ms=${MATCH_TIME_BUDGET_MS:60000}

# Telecom Simulation
turant.telecom.use-dummy-db=${USE_DUMMY_SUBSCRIBER_DB:false}
turant.telecom.db-mode=${SUBSCRIBER_DB_MODE:memory}
turant.telecom.sim-region=${SIM_REGION:delhi-ncr}
turant.telecom.sim-seed=${SIM_SEED:20260902}
turant.telecom.dummy-subscriber-count=${DUMMY_SUBSCRIBER_COUNT:1000}
turant.telecom.dummy-tower-count=${DUMMY_TOWER_COUNT:100}
turant.telecom.min-users-per-tower=${MIN_USERS_PER_TOWER:10}
turant.telecom.max-users-per-tower=${MAX_USERS_PER_TOWER:500}
turant.telecom.active-subscriber-pct=${ACTIVE_SUBSCRIBER_PCT:85}
turant.telecom.seed-batch-size=${SEED_BATCH_SIZE:1000}
turant.telecom.seed-workers=${SEED_WORKERS:1}
turant.telecom.seed-use-copy=${SEED_USE_COPY:false}
turant.telecom.seed-reset=${SIM_SEED_RESET:false}
turant.telecom.subscriber-partitions=${SUBSCRIBER_PARTITIONS:0}
turant.telecom.subscriber-lookup-chunk-size=${SUBSCRIBER_LOOKUP_CHUNK_SIZE:1000}

# SMPP Configuration
turant.smpp.host=${SMPP_HOST:}
turant.smpp.port=${SMPP_PORT:2775}
turant.smpp.system-id=${SMPP_SYSTEM_ID:}
turant.smpp.password=${SMPP_PASSWORD:}
turant.smpp.system-type=${SMPP_SYSTEM_TYPE:}
turant.smpp.bind-mode=${SMPP_BIND_MODE:transceiver}
turant.smpp.interface-version=${SMPP_INTERFACE_VERSION:0x34}
turant.smpp.src-addr-ton=${SMPP_SRC_ADDR_TON:0}
turant.smpp.src-addr-npi=${SMPP_SRC_ADDR_NPI:0}
turant.smpp.src-addr=${SMPP_SRC_ADDR:}
turant.smpp.dest-addr-ton=${SMPP_DEST_ADDR_TON:1}
turant.smpp.dest-addr-npi=${SMPP_DEST_ADDR_NPI:1}
turant.smpp.data-coding=${SMS_DATA_CODING:7bit}
turant.smpp.registered-delivery=${SMS_REGISTERED_DELIVERY:0x03}
turant.smpp.reconnect-delay-ms=${SMPP_RECONNECT_DELAY_MS:5000}
turant.smpp.submit-timeout-ms=${SMPP_SUBMIT_TIMEOUT_MS:10000}
turant.smpp.enquire-link-period-ms=${SMPP_ENQUIRE_LINK_PERIOD_MS:30000}
turant.smpp.submit-concurrency=${SMPP_SUBMIT_CONCURRENCY:25}

# Delivery Strategy
turant.delivery.strategy=${DELIVERY_STRATEGY:single-attempt}
turant.delivery.retry-max=${DELIVERY_RETRY_MAX:3}
turant.delivery.retry-interval-ms=${DELIVERY_RETRY_INTERVAL_MS:2000}

# Expiry Control
turant.expiry.halt-submission=${EXPIRY_HALT_SUBMISSION:true}

# EWS Callback
turant.ews.callback-url=${EWS_CALLBACK_URL:}
turant.ews.callback-token=${EWS_CALLBACK_TOKEN:}
turant.ews.callback-timeout-ms=${EWS_CALLBACK_TIMEOUT_MS:5000}

# Parallel Processing
turant.parallel.execution-mode=${PARALLEL_EXECUTION_MODE:threads}
turant.parallel.worker-count=${PARALLEL_WORKER_COUNT:4}
turant.parallel.submit-batch-size=${SUBMIT_BATCH_SIZE:500}

# Tracing
turant.trace.ttl-hours=${TRACE_TTL_HOURS:24}

# Debug
turant.debug.endpoints-enabled=${ENABLE_DEBUG_ENDPOINTS:false}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
