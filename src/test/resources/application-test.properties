# Test configuration for TURANT
# This configuration is used during integration tests

# Enable simulation mode for testing without real infrastructure
simulation.mode=enabled

# Database - use in-memory H2 or test container
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Redis - embedded or mock
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Disable Redis requirement for tests
spring.data.redis.repositories.enabled=false

# Tower matching configuration
tower.source-mode=simulated
tower.match-time-budget-ms=5000
tower.max-towers=100

# Subscriber matching - use simulation
subscriber.matching-available=true
subscriber.matcher-impl=simulated

# SMPP - disabled for tests (using simulated client)
smpp.host=
smpp.port=2775
smpp.system-id=
smpp.password=
smpp.submit-timeout-ms=5000
smpp.submit-concurrency=5

# Pipeline configuration
pipeline.default-timeout-ms=10000
pipeline.max-concurrent-alerts=10

# Logging
logging.level.com.turant=DEBUG
logging.level.org.springframework=INFO
logging.level.org.jsmpp=WARN

# Test-specific settings
test.mock-delays=false
test.quick-mode=true
